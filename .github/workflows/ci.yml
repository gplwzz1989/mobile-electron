name: Mobile Electron CI (Build APK & IPA)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: '打包模式 (local: 内置本地离线页面; online: 加载在线 URL)'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - online
      online_url:
        description: '在线 URL 地址 (仅 online 模式生效)'
        required: false
        default: 'https://m.baidu.com'
        type: string

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. 构建 Web 控制中心与 TypeScript SDK
  # -------------------------------------------------------------
  build-web:
    name: 🌐 构建 Web 与 SDK
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            sdk/package.json
            web/package.json

      - name: 构建 SDK
        run: |
          cd sdk
          npm install
          npm run build

      - name: 构建 Web 应用
        run: |
          cd web
          npm install
          npm run build

      - name: 归档 Web 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # -------------------------------------------------------------
  # 2. 构建 Android APK (Debug & Release)
  # -------------------------------------------------------------
  build-android:
    name: 🤖 构建 Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 下载 Web 前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 执行打包预处理与模式配置
        run: |
          MODE="${{ github.event.inputs.build_mode || 'local' }}"
          URL="${{ github.event.inputs.online_url || 'https://m.baidu.com' }}"
          if [ "$MODE" = "online" ]; then
            node scripts/prepare-build.js --mode online --url "$URL"
          else
            node scripts/prepare-build.js --mode local --skip-build
          fi

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 执行 Gradle 编译打包 APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: 整理 APK 产物
        run: |
          mkdir -p output-apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          echo "=== 已生成 APK 列表 ==="
          ls -lh output-apk/

      - name: 上传 Android APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileElectron-Android-APKs
          path: output-apk/*.apk
          retention-days: 14

  # -------------------------------------------------------------
  # 3. 构建 iOS IPA (macOS + XcodeGen + xcodebuild)
  # -------------------------------------------------------------
  build-ios:
    name: 🍎 构建 iOS IPA
    runs-on: macos-14
    needs: build-web
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 下载 Web 前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: 执行打包预处理与模式配置
        run: |
          MODE="${{ github.event.inputs.build_mode || 'local' }}"
          URL="${{ github.event.inputs.online_url || 'https://m.baidu.com' }}"
          if [ "$MODE" = "online" ]; then
            node scripts/prepare-build.js --mode online --url "$URL"
          else
            node scripts/prepare-build.js --mode local --skip-build
          fi

      - name: 安装 XcodeGen 构建工具
        run: brew install xcodegen

      - name: 生成 Xcode 项目文件 (.xcodeproj)
        run: |
          cd ios
          xcodegen generate

      - name: 编译 iOS 应用程序 (.app)
        run: |
          cd ios
          xcodebuild -project MobileElectron.xcodeproj \
                     -scheme MobileElectron \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: 打包为 iOS 安装包 (.ipa)
        run: |
          cd ios
          mkdir -p Payload
          APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "错误: 未找到编译生成的 .app 目录"
            exit 1
          fi
          echo "📦 正在打包应用目录: $APP_DIR"
          cp -R "$APP_DIR" Payload/
          zip -qr MobileElectron.ipa Payload
          echo "=== 已生成 IPA 详情 ==="
          ls -lh MobileElectron.ipa

      - name: 上传 iOS IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileElectron-iOS-IPA
          path: ios/MobileElectron.ipa
          retention-days: 14

  # -------------------------------------------------------------
  # 4. 自动发布 Release (仅当推送到 Release Tag v* 时执行)
  # -------------------------------------------------------------
  release:
    name: 🚀 自动发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 下载 Android APK 产物
        uses: actions/download-artifact@v4
        with:
          name: MobileElectron-Android-APKs
          path: release-assets/apk

      - name: 下载 iOS IPA 产物
        uses: actions/download-artifact@v4
        with:
          name: MobileElectron-iOS-IPA
          path: release-assets/ipa

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/apk/*.apk
            release-assets/ipa/*.ipa
          generate_release_notes: true
