name: MobileElectron
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  projectFormat: "xcode15_0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  MobileElectron:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: MobileElectron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cookiebrowser
        PRODUCT_NAME: MobileElectron
        INFOPLIST_FILE: MobileElectron/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  MobileElectron:
    build:
      targets:
        MobileElectron: all
    run:
      config: Debug
    archive:
      config: Release
